readme = "README.md"
authors = [
    { name = "Aniketanand", email = "aniketanand2712@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.5",
